name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  editor:
    name: Editor build and tests (macOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
